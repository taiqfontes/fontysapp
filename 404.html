<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Fontys Auto</title>
<script>
// Truque padrão pra SPA funcionar em rotas "limpas" (/ordemdeservico, /clientes...)
// hospedada no GitHub Pages: como o GitHub não tem servidor pra reescrever rotas,
// toda URL desconhecida cai aqui e é redirecionada de volta pro index.html, que
// então restaura a rota original (veja o script no início do <head> do index.html).
// pathSegmentsToKeep = 0 porque o site está na raiz do domínio (fontysauto.com.br),
// não numa subpasta de projeto do GitHub (ex: usuario.github.io/repo).
var pathSegmentsToKeep = 0;
var l = window.location;
l.replace(
  l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
  l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
  l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
  (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
  l.hash
);
</script>
</head>
<body></body>
</html>
